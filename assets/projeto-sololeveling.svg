<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" role="img" aria-label="Solo TCG: Card game inspirado em Solo Leveling: 36 cartas com raridades e elementos, efeitos animados, pacotes, portais e batalha tática.">
<defs><linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><clipPath id="r"><rect width="490" height="250" rx="16"/></clipPath></defs>
<style>
text{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.sw{animation:sw 4.5s ease-in-out infinite}@keyframes sw{from{transform:translateX(-490px)}to{transform:translateX(490px)}}
.ct{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lk{animation:pl 2.6s ease-in-out infinite}@keyframes pl{50%{opacity:.4}}
.bar{animation:gr 1.2s ease-out both}@keyframes gr{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.ct{opacity:1}}
</style>
<rect width="490" height="250" rx="16" fill="#161b22"/>
<g clip-path="url(#r)"><rect class="sw" x="0" y="0" width="490" height="3" fill="url(#b)"/></g>
<rect x=".5" y=".5" width="489" height="249" rx="15.5" fill="none" stroke="#30363d"/>
<text x="24" y="42" font-size="24" font-weight="700" fill="#e6edf3">Solo TCG</text>
<g class="lk" transform="translate(446,22)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round"><rect x="2" y="9" width="16" height="12" rx="3" fill="#8b949e" fill-opacity=".25"/><path d="M5 9V6a5 5 0 0 1 10 0v3"/></g>
<rect x="24" y="58" width="151" height="22" rx="11" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-opacity=".65"/><text x="99.5" y="73" font-size="11" font-weight="600" text-anchor="middle" fill="#fbbf24">Em desenvolvimento</text>
<rect x="183" y="58" width="85" height="22" rx="11" fill="#8b949e" fill-opacity=".16" stroke="#8b949e" stroke-opacity=".65"/><text x="231.5" y="73" font-size="11" font-weight="600" text-anchor="middle" fill="#8b949e">Privado</text>
<circle cx="194" cy="69" r="3" fill="#8b949e"/>
<rect x="276" y="58" width="118" height="22" rx="11" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".65"/><text x="335" y="73" font-size="11" font-weight="600" text-anchor="middle" fill="#a78bfa">Projeto pessoal</text>
<text x="24" y="112" font-size="15" fill="#8b949e">Card game inspirado em Solo Leveling: 36</text>
<text x="24" y="136" font-size="15" fill="#8b949e">cartas com raridades e elementos, efeitos</text>
<text x="24" y="160" font-size="15" fill="#8b949e">animados, pacotes, portais e batalha tática.</text>
<rect class="bar" x="24" y="176" width="60" height="3" rx="1.5" fill="#a78bfa" style="transform-origin:24px 177px"/>
