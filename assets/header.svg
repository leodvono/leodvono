<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Leonardo Vono, Desenvolvedor de Software Pleno">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<clipPath id="c"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif}
.w1{animation:mv 14s linear infinite}.w2{animation:mv 22s linear infinite reverse}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.f{opacity:0;animation:fr 12s infinite}.f2{animation-delay:4s}.f3{animation-delay:8s}
@keyframes fr{0%{opacity:0;transform:translateY(6px)}4%,28%{opacity:1;transform:none}33%,100%{opacity:0}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.tag{animation:fl 4s ease-in-out infinite}.t2{animation-delay:.6s}.t3{animation-delay:1.2s}.t4{animation-delay:1.8s}
@keyframes fl{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.f{opacity:1}.f2,.f3{display:none}}
</style>
<rect width="1000" height="260" rx="18" fill="#0d1117"/>
