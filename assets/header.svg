<g class="tag t2"><rect x="830" y="62" width="104" height="32" rx="16" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".7"/><text x="882" y="83" font-size="14" font-weight="600" text-anchor="middle" fill="#f472b6">SQL Server</text></g>
