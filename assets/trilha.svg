<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d"><title id="t">Minha trilha</title><desc id="d">Trilha profissional: suporte e infraestrutura de TI, estágio em .NET, desenvolvedor júnior, desenvolvedor pleno (hoje) e Full Stack como próximo passo.</desc><style>text{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}.p2{animation-delay:-1.3s}@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.march{animation:march 1.4s linear infinite}@keyframes march{to{stroke-dashoffset:-24}}.run{animation:run 7s linear infinite}@keyframes run{0%{transform:translateX(100px);opacity:0}7%{opacity:1}93%{opacity:1}100%{transform:translateX(900px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.run{display:none}}</style><defs><clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="700" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".6" stop-color="#818cf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs><g clip-path="url(#card)"><rect width="1000" height="250" fill="#0d1117"/><rect width="1000" height="3" fill="url(#top)"/><text x="40" y="52" font-size="22" font-weight="800" fill="#e6edf3">Minha trilha</text><text x="960" y="52" text-anchor="end" font-size="13" fill="#8b949e">do suporte ao pleno, rumo ao Full Stack</text><line x1="100" y1="124" x2="900" y2="124" stroke="#30363d" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="124" x2="700" y2="124" stroke="url(#gl)" stroke-width="4" stroke-linecap="round"/><line class="march" x1="716" y1="124" x2="884" y2="124" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8" stroke-opacity=".85"/><text class="mono" x="100" y="86" text-anchor="middle" font-size="12" fill="#6e7681">01</text><circle cx="100" cy="124" r="13" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/><circle cx="100" cy="124" r="5" fill="#38bdf8"/><text x="100" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Suporte e infra de TI</text><text x="100" y="196" text-anchor="middle" font-size="12.5" fill="#8b949e">estágio</text><text class="mono" x="300" y="86" text-anchor="middle" font-size="12" fill="#6e7681">02</text><circle cx="300" cy="124" r="13" fill="#0d1117" stroke="#60a5fa" stroke-width="3"/><circle cx="300" cy="124" r="5" fill="#60a5fa"/><text x="300" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Desenvolvedor .NET</text><text x="300" y="196" text-anchor="middle" font-size="12.5" fill="#8b949e">estágio · C# e SQL Server</text><text class="mono" x="500" y="86" text-anchor="middle" font-size="12" fill="#6e7681">03</text><circle cx="500" cy="124" r="13" fill="#0d1117" stroke="#818cf8" stroke-width="3"/><circle cx="500" cy="124" r="5" fill="#818cf8"/><text x="500" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Desenvolvedor Júnior</text><text x="500" y="196" text-anchor="middle" font-size="12.5" fill="#8b949e">SQL Server, CRM e APIs REST</text><g transform="translate(700 82)"><rect x="-27" y="-13" width="54" height="26" rx="13" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".7"/><text class="mono" y="4.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.4" fill="#ddd6fe">HOJE</text></g><circle class="pulse" cx="700" cy="124" r="16" fill="none" stroke="#a78bfa" stroke-width="2"/><circle class="pulse p2" cx="700" cy="124" r="16" fill="none" stroke="#a78bfa" stroke-width="2"/><circle cx="700" cy="124" r="16" fill="#0d1117" stroke="#a78bfa" stroke-width="3.5"/><circle cx="700" cy="124" r="7" fill="#a78bfa"/><text x="700" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Desenvolvedor Pleno</text><text x="700" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c4b5fd">onde estou hoje</text><text class="mono" x="900" y="86" text-anchor="middle" font-size="12" fill="#6e7681">05</text><circle class="spin" cx="900" cy="124" r="14" fill="#0d1117" stroke="#5eead4" stroke-width="2.4" stroke-dasharray="4 5" stroke-linecap="round"/><circle cx="900" cy="124" r="4" fill="none" stroke="#5eead4" stroke-width="2"/><text x="900" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Full Stack</text><text x="900" y="196" text-anchor="middle" font-size="12.5" fill="#8b949e">próximo passo · React</text><g transform="translate(0 124)"><g class="run"><circle r="10" fill="#ffffff" fill-opacity=".16"/><circle r="4" fill="#ffffff"/></g></g></g><rect x=".5" y=".5" width="999" height="249" rx="18" fill="none" stroke="#30363d"/></svg>